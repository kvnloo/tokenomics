[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tokenomics"
version = "0.1.0"
description = "Vendor-neutral measurement contracts for LLMs, agents, harnesses, latency, cost, context and verified outcomes"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["llm", "agents", "observability", "opentelemetry", "token-usage", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kvnloo/tokenomics"
Repository = "https://github.com/kvnloo/tokenomics"
Issues = "https://github.com/kvnloo/tokenomics/issues"

[project.optional-dependencies]
otel = [
  "opentelemetry-api>=1.42,<2",
  "opentelemetry-sdk>=1.42,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.42,<2",
]
test = ["pytest>=8,<10", "jsonschema>=4,<5"]
all = [
  "opentelemetry-api>=1.42,<2",
  "opentelemetry-sdk>=1.42,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.42,<2",
  "pytest>=8,<10",
  "jsonschema>=4,<5",
]

[project.scripts]
tokenomics = "tokenomics.cli:main"

[project.entry-points."hermes_agent.plugins"]
tokenomics = "tokenomics.hermes_plugin:register"

[tool.setuptools]
package-dir = {"" = "packages/python/src"}

[tool.setuptools.packages.find]
where = ["packages/python/src"]

[tool.setuptools.package-data]
tokenomics = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["packages/python/tests"]
addopts = "-q"
