name: release

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify release versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          py_version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          npm_version = json.loads(
              Path("packages/typescript/package.json").read_text()
          )["version"]
          expected_tag = f"v{py_version}"
          tag = os.environ["RELEASE_TAG"]

          if npm_version != py_version:
              raise SystemExit(f"package versions differ: Python={py_version}, npm={npm_version}")
          if tag != expected_tag:
              raise SystemExit(f"release tag {tag!r} does not match {expected_tag!r}")
          PY

      - name: Build Python distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Test built Python wheel
        run: |
          python -m venv /tmp/tokenomics-release-wheel
          /tmp/tokenomics-release-wheel/bin/pip install dist/*.whl
          /tmp/tokenomics-release-wheel/bin/python -c "import tokenomics; print(tokenomics.__version__)"

      - name: Build and test npm package
        run: |
          mkdir -p dist-npm
          cd packages/typescript
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          npm pack --pack-destination ../../dist-npm

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: npm-dist
          path: dist-npm/*.tgz

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: npm-dist
          path: dist-npm
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm install --global "npm@^11.15.0"
      - run: npm publish dist-npm/*.tgz --access public
